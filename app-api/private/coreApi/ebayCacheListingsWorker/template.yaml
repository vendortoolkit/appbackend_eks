      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 120
      Description: Main function for launching full ebay listing recache jobs
      Role: arn:aws:iam::832635066076:role/vtk_app_lambda
      Layers:
          - "arn:aws:lambda:eu-west-1:832635066076:layer:vtk_api_layer_awsSdk:11"
          - "arn:aws:lambda:eu-west-1:832635066076:layer:vtk_api_layer_ebayApi:19"
      Tags:
        CostCenter: "VendorToolKit"
    Metadata:
      BuildMethod: nodejs24.x
      BuildCommands:
        - npm install --omit=dev
      BuildArchitecture: x86_64


Globals:
  Function:
    Tracing: Active
  Api:
    TracingEnabled: true

